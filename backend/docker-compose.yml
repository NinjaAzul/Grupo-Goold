services:
  mysql:
    image: mysql:8.0
    container_name: grupo-goold-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: grupo_goold
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - grupo-goold-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grupo-goold-backend
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: grupo_goold
      DB_USER: root
      DB_PASSWORD: password
      PORT: 3001
      NODE_ENV: development
    volumes:
      - ./src:/app/src
      - /app/node_modules
    entrypoint: sh -c "npm install && npm run dev"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - grupo-goold-network

volumes:
  mysql_data:

networks:
  grupo-goold-network:
    driver: bridge

